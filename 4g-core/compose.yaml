services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    command: --bind_ip 0.0.0.0
    volumes:
      - mongodbdata:/data/db
      - mongodbdata:/data/configdb
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "27017/udp"
      - "27017/tcp"
    networks:
      default:
        ipv4_address: ${MONGO_IP}
  webui:
    image: ghcr.io/tknika/docker_open5gs:v2.7.6-20251216
    container_name: webui
    depends_on:
      - mongo
    environment:
      - COMPONENT_NAME=webui
      - MONGO_IP=${MONGO_IP}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "9999/tcp"
    ports:
      - "9999:9999/tcp"
    networks:
      default:
        ipv4_address: ${WEBUI_IP}
  hss:
    image: ghcr.io/tknika/docker_open5gs:v2.7.6-20251216
    container_name: hss
    environment:
      - COMPONENT_NAME=hss
      - MNC=${MNC}
      - MCC=${MCC}
      - HSS_IP=${HSS_IP}
      - MME_IP=${MME_IP}
      - MONGO_IP=${MONGO_IP}
      - MAX_NUM_UE=${MAX_NUM_UE}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - mongo
    expose:
      - "3868/tcp"
      - "3868/sctp"
      - "5868/tcp"
      - "5868/sctp"
    networks:
      default:
        ipv4_address: ${HSS_IP}
  sgwc:
    image: ghcr.io/tknika/docker_open5gs:v2.7.6-20251216
    depends_on:
      - smf
      - upf
    container_name: sgwc
    environment:
      - COMPONENT_NAME=sgwc
      - SGWU_IP=${SGWU_IP}
      - SGWC_IP=${SGWC_IP}
      - MAX_NUM_UE=${MAX_NUM_UE}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "2123/udp"
      - "8805/udp"
    networks:
      default:
        ipv4_address: ${SGWC_IP}
  sgwu:
    image: ghcr.io/tknika/docker_open5gs:v2.7.6-20251216
    depends_on:
      - smf
      - upf
    container_name: sgwu
    environment:
      - COMPONENT_NAME=sgwu
      - SGWU_IP=${SGWU_IP}
      - SGWC_IP=${SGWC_IP}
      - SGWU_ADVERTISE_IP=${SGWU_ADVERTISE_IP}
      - MAX_NUM_UE=${MAX_NUM_UE}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "8805/udp"
      - "2152/udp"
    ports:
      - "${SGWU_ADVERTISE_IP}:2152:2152/udp"
    networks:
      default:
        ipv4_address: ${SGWU_IP}
  smf:
    image: ghcr.io/tknika/docker_open5gs:v2.7.6-20251216
    container_name: smf
    environment:
      - COMPONENT_NAME=smf
      - DEPLOY_MODE=4G
      - SMF_IP=${SMF_IP}
      - SCP_IP=${SCP_IP}
      - NRF_IP=${NRF_IP}
      - UPF_IP=${UPF_IP}
      - PCSCF_IP=${PCSCF_IP}
      - PCRF_IP=${PCRF_IP}
      - OCS_IP=${OCS_IP}
      - OSMOEPDG_IP=${OSMOEPDG_IP}
      - SMF_DNS1=${SMF_DNS1}
      - SMF_DNS2=${SMF_DNS2}
      - MAX_NUM_UE=${MAX_NUM_UE}
      - PCRF_BIND_PORT=${PCRF_BIND_PORT}
      - OCS_BIND_PORT=${OCS_BIND_PORT}
      - UE_IPV4_INTERNET=${UE_IPV4_INTERNET}
      - UE_IPV4_IMS=${UE_IPV4_IMS}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "3868/tcp"
      - "3868/sctp"
      - "5868/tcp"
      - "5868/sctp"
      - "8805/udp"
      - "2123/udp"
      - "7777/tcp"
      - "9091/tcp"
    networks:
      default:
        ipv4_address: ${SMF_IP}
  upf:
    image: ghcr.io/tknika/docker_open5gs:v2.7.6-20251216
    depends_on:
      - smf
    container_name: upf
    environment:
      - COMPONENT_NAME=upf
      - UPF_TUNTAP_MODE=${UPF_TUNTAP_MODE}
      - UPF_ADVERTISE_IP=${UPF_ADVERTISE_IP}
      - UPF_INTERNET_APN_IF_NAME=${UPF_INTERNET_APN_IF_NAME}
      - UPF_IMS_APN_IF_NAME=${UPF_IMS_APN_IF_NAME}
      - UE_IPV4_INTERNET=${UE_IPV4_INTERNET}
      - UE_IPV4_IMS=${UE_IPV4_IMS}
      - MAX_NUM_UE=${MAX_NUM_UE}
      - UPF_IP=${UPF_IP}
      - SMF_IP=${SMF_IP}
      - PCSCF_IP=${PCSCF_IP}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "2152/udp"
      - "8805/udp"
      - "9091/tcp"
    cap_add:
      - NET_ADMIN
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.disable_ipv6=0
    networks:
      default:
        ipv4_address: ${UPF_IP}
  mme:
    image: ghcr.io/tknika/docker_open5gs:v2.7.6-20251216
    depends_on:
      - hss
      - sgwc
      - sgwu
      - smf
      - upf
      #- osmomsc
    container_name: mme
    environment:
      - COMPONENT_NAME=mme
      - MNC=${MNC}
      - MCC=${MCC}
      - TAC=${TAC}
      - MAX_NUM_UE=${MAX_NUM_UE}
      - MME_IP=${MME_IP}
      - OSMOMSC_IP=${OSMOMSC_IP}
      - SGWC_IP=${SGWC_IP}
      - SMF_IP=${SMF_IP}
      - HSS_IP=${HSS_IP}

    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "3868/tcp"
      - "3868/sctp"
      - "5868/tcp"
      - "5868/sctp"
      - "36412/sctp"
      - "2123/udp"
      - "9091/tcp"
    ports:
      - "36412:36412/sctp"
    networks:
      default:
        ipv4_address: ${MME_IP}
  pcrf:
    image: ghcr.io/tknika/docker_open5gs:v2.7.6-20251216
    container_name: pcrf
    environment:
      - COMPONENT_NAME=pcrf
      - MONGO_IP=${MONGO_IP}
      - MAX_NUM_UE=${MAX_NUM_UE}
      - PCRF_IP=${PCRF_IP}
      - SMF_IP=${SMF_IP}
      - PCRF_BIND_PORT=${PCRF_BIND_PORT}
      - PCSCF_IP=${PCSCF_IP}
      - PCSCF_BIND_PORT=${PCSCF_BIND_PORT}
    depends_on:
      - mongo
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "${PCRF_BIND_PORT}/tcp"
      - "${PCRF_BIND_PORT}/sctp"
      - "5868/tcp"
      - "5868/sctp"
    ports:
       - "${PCRF_BIND_PORT}:${PCRF_BIND_PORT}/sctp"
       - "${PCRF_BIND_PORT}:${PCRF_BIND_PORT}/tcp"
    networks:
      default:
        ipv4_address: ${PCRF_IP}

networks:
  default:
    external: true
    name: docker_open5gs_default
    ipam:
      config:
        - subnet: ${INTERNAL_NETWORK_SUBNET}

volumes:
  mongodbdata:
    name: docker_open5gs_mongodbdata
